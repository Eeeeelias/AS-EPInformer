cell: "Cell line to use. Options: K562, GM12878, both."
fold: "Test fold(s). Accepts a comma-separated list or 'all'."
model_type: "EPInformer variant to use. Options: EPInformer-PE, EPInformer-PE-Activity, EPInformer-PE-Activity-HiC."
distance_threshold: "Maximum genomic distance to TSS (in base pairs)."
hic_threshold: "Minimum Hi-C score threshold to include loops. -1 disables."
expr_assay: "Expression assay type. Options: CAGE, RNA, multi, splice."

batch_size: "Batch size for training."
n_interact_enc: "Number of interaction encoder layers."
epochs: "Number of training epochs."

cuda: "Use CUDA if available."
xpu: "Use Intel XPU (experimental)."
use_pretrained_encoder: "Whether to use a pretrained sequence encoder."

rna_seq_source: "RNA-seq source, always epiatlas when using include_exons. Options: xpresso, epiatlas."
tpm_level: "TPM level. Options: gene or transcript."
include_exons: "Include exon-level input features."
single_events: "Use only one event per gene in training."
z_score_normalise: "Apply z-score normalization to inputs."
event_genes: "Restrict to genes with at least one associated event."
learn_loss_weights: "Learn task-specific loss weights."
weigh_samples: "Weigh samples based on frequency."

expr_loss: "Loss function for expression task. Options: mse, smoothl1."
splice_loss: "Loss function for splicing task. Options: bce, smoothl1."

short_run: "Run a reduced version for quick debugging."
set_exon_zero: "Zero-out exon data (ablation)."
set_pe_zero: "Zero-out promoter/enhancer data (ablation)."
set_rna_zero: "Zero-out RNA features (ablation)."
set_histones_zero: "Zero-out histone marks (ablation)."
set_extra_feat_zero: "Zero-out HiC, activity, and distance features (ablation)."
set_promoter_zero: "Zero-out promoter features (ablation)."
remove_ar_events: "Exclude artificial events from training."
